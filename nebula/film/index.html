<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nébula — Agentes de IA</title>
<style>
  @font-face { font-family: 'Inter'; src: url(fonts/inter-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Inter'; src: url(fonts/inter-latin-ext-wght-normal.woff2) format('woff2'); font-weight: 100 900;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'GeistMono'; src: url(fonts/geist-mono-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #0d0b15; transform-origin: 0 0; -webkit-font-smoothing: antialiased; }
  #stage * { box-sizing: border-box; }
  .abs { position: absolute; left: 0; top: 0; }
  .disp { font-family: 'Inter'; font-weight: 800; letter-spacing: -0.045em; line-height: 1; white-space: pre; color: #f1eff9; }
  .mono { font-family: 'GeistMono'; font-weight: 500; letter-spacing: 0.18em; white-space: pre; line-height: 1; text-transform: uppercase; }
  .lav { background: linear-gradient(95deg, #8a58e4 0%, #a277e5 55%, #c4aef2 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  img { display: block; position: absolute; left: 0; top: 0; }
  .feather { -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent), linear-gradient(180deg, transparent, #000 12%, #000 88%, transparent); -webkit-mask-composite: source-in; mask-composite: intersect; }
.feather-soft { -webkit-mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent), linear-gradient(180deg, transparent, #000 16%, #000 84%, transparent); -webkit-mask-composite: source-in; mask-composite: intersect; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="film.js"></script>
</body>
</html>
