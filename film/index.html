<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo negocio necesita una web</title>
<style>
  @font-face {
    font-family: 'Archivo';
    src: url(fonts/archivo-latin-standard-normal.woff2) format('woff2');
    font-weight: 100 900; font-stretch: 62% 125%;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Archivo';
    src: url(fonts/archivo-latin-ext-standard-normal.woff2) format('woff2');
    font-weight: 100 900; font-stretch: 62% 125%;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Geist';
    src: url(fonts/geist-latin-wght-normal.woff2) format('woff2');
    font-weight: 100 900;
  }
  :root {
    --ink: #0b0b0c; --paper: #f1eee6; --accent: #3b1d66; --white: #ffffff;
  }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: var(--paper); transform-origin: 0 0;
    font-kerning: normal; text-rendering: geometricPrecision;
    -webkit-font-smoothing: antialiased;
  }
  #stage * { box-sizing: border-box; }
  .abs { position: absolute; left: 0; top: 0; }
  .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; display: none; }
  .disp { font-family: 'Archivo'; font-weight: 900; white-space: pre; line-height: 1; }
  .ui { font-family: 'Geist'; white-space: pre; line-height: 1; }
  body.preview { display: grid; place-items: center; height: 100vh; background: #111; }
  #hud { position: fixed; left: 12px; bottom: 12px; color: #aaa; font: 12px/1.4 Geist, sans-serif; display: none; }
  body.preview #hud { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">space: play/pause · ←/→: step · click stage: scrub</div>
<script type="module" src="film.js"></script>
</body>
</html>
